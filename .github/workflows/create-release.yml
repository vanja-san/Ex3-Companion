# Build the mod jar and publish it as a GitHub release.
#
# Manual only, on purpose: a release tags a commit, and that should never
# happen because somebody pushed to a branch. Run it from the Actions tab once
# the commit you want to ship is on the branch.
#
# The tag defaults to the version in gradle.properties, so the release tag and
# the artifact can never drift apart the way a hand-typed tag does. The release
# notes are generated from the git history rather than kept in a hand-written
# file, because a file that is forgotten goes stale quietly and the same lines
# end up in release after release.

name: create-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Leave empty to use v<version from gradle.properties>."
        required: false
        type: string
      prerelease:
        description: "Mark the release as a prerelease."
        required: false
        default: false
        type: boolean

# A release rewrites tags, so two runs at once would race each other.
concurrency:
  group: create-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          # The notes are generated from history, so the full log has to be there.
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build
      - name: resolve version and release tag
        id: release
        env:
          # Passed through the environment rather than interpolated into the script,
          # so a hand-typed tag can never be read as shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ -z "$version" ]; then
            echo "::error::no version= line in gradle.properties"
            exit 1
          fi

          minecraft="$(sed -n 's/^minecraft = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          if [ -z "$minecraft" ]; then
            echo "::error::no minecraft version in gradle/libs.versions.toml"
            exit 1
          fi

          tag="${INPUT_TAG:-v${version}}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "minecraft=${minecraft}" >> "$GITHUB_OUTPUT"

      - name: verify the jar matches the version
        id: jar
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MINECRAFT: ${{ steps.release.outputs.minecraft }}
        run: |
          set -euo pipefail
          # The jar name carries the Minecraft version, and build.gradle.kts reads it
          # from the same libs.versions.toml entry this step reads, so the file on disk
          # is the one that is expected.
          jar="build/libs/Ex3Companion-v${VERSION}-mc${MINECRAFT}-Fabric.jar"

          if [ ! -f "$jar" ]; then
            echo "::error::expected ${jar}, found instead:"
            ls -1 build/libs/ || true
            exit 1
          fi

          # The jar's own metadata is the authority, not the file name.
          actual="$(unzip -p "$jar" fabric.mod.json | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::fabric.mod.json in the jar says ${actual}, gradle.properties says ${VERSION}"
            exit 1
          fi

          echo "verified ${jar}"
          echo "JAR_PATH=${jar}" >> "$GITHUB_OUTPUT"

      - name: generate release notes
        id: generate_release_notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          MINECRAFT: ${{ steps.release.outputs.minecraft }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"

          # The tag does not exist yet - gh creates it - so this resolves to the tag
          # *before* this release, which is exactly the range the notes should cover.
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [ -n "$previous" ]; then
            range="${previous}..HEAD"
            intro="Changes since ${previous}:"
            footer="Full Changelog: https://github.com/${REPO}/compare/${previous}...${TAG}"
          else
            # First release in the repository: there is nothing to diff against, so
            # every commit counts rather than failing on the missing describe.
            range="HEAD"
            intro="Everything in this release:"
            footer=""
          fi

          subjects="$(git log --pretty='%s' $range)"

          {
            echo "Ex3 Companion ${TAG} for Minecraft ${MINECRAFT} (Fabric)."
            echo
            echo "${intro}"
            echo
          } >> "$notes_file"

          # GitHub renders the release body as Markdown and silently drops anything
          # that parses as an HTML tag, so a subject like "core_<colour>" published
          # as "core_" with the angle-bracketed part gone. Backticks mark the text as
          # literal, so the renderer leaves it alone.
          literalize() {
            case "$1" in
              *'<'*|*'>'*) printf '`%s`' "$1" ;;
              *)           printf '%s' "$1" ;;
            esac
          }

          # Commits follow conventional-commit prefixes, so they can be grouped without
          # anyone maintaining a changelog by hand. The prefix is dropped on the way out,
          # because the section title already says what the group is.
          emit() {
            local title="$1" pattern="$2" matched subject clean
            matched="$(printf '%s\n' "$subjects" | grep -E "$pattern" || true)"
            [ -z "$matched" ] && return 0
            echo "${title}" >> "$notes_file"
            while IFS= read -r subject; do
              [ -n "$subject" ] || continue
              clean="$(printf '%s' "$subject" | sed -E 's/^[a-z]+(\([^)]*\))?:[[:space:]]*//')"
              echo "- $(literalize "$clean")" >> "$notes_file"
            done <<< "$matched"
            echo >> "$notes_file"
          }

          emit "New"        '^(feat|feature)(\([^)]*\))?: '
          emit "Fixed"      '^(fix|bugfix)(\([^)]*\))?: '
          emit "Changed"    '^refactor(\([^)]*\))?: '
          emit "Tests"      '^test(\([^)]*\))?: '
          emit "Docs"       '^docs(\([^)]*\))?: '
          emit "Build & CI" '^(chore|ci|build)(\([^)]*\))?: '

          # Anything without a recognised prefix still happened and should be visible.
          other="$(printf '%s\n' "$subjects" \
            | grep -Ev '^(feat|feature|fix|bugfix|refactor|test|docs|chore|ci|build)(\([^)]*\))?: ' \
            || true)"
          if [ -n "$other" ]; then
            echo "Other changes" >> "$notes_file"
            while IFS= read -r subject; do
              [ -n "$subject" ] || continue
              echo "- $(literalize "$subject")" >> "$notes_file"
            done <<< "$other"
            echo >> "$notes_file"
          fi

          if [ -n "$footer" ]; then
            echo "${footer}" >> "$notes_file"
          fi

          echo "notes written to ${notes_file}"
          echo "----------------------------------------"
          cat "$notes_file"
          echo "----------------------------------------"
          echo "NOTES_PATH=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          JAR_PATH: ${{ steps.jar.outputs.JAR_PATH }}
          PRERELEASE: ${{ inputs.prerelease }}
          NOTES_PATH: ${{ steps.generate_release_notes.outputs.NOTES_PATH }}
        run: |
          set -euo pipefail

          args=()
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG" \
            "$JAR_PATH" \
            --title "$TAG" \
            --notes-file "$NOTES_PATH" \
            "${args[@]}"
