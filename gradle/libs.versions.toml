[versions]
loom = "1.18.3"
minecraft = "26.3"
loader = "0.19.5"
fabric-api = "0.162.0+26.3"
fabric-kotlin = "1.14.2+kotlin.2.4.21"
configlibtxf = "26.3-2.0.5-fabric"
jei = "FoSbXUVi"
jade = "71CTWqdE"
resourcify = "fRxNdO2e"
sodium = "v4PSXean"
iris = "vTN4NRGW"
lambdynlights = "rylKnJ4M"
modmenu = "kyy7dbrZ"
kotlin = "2.4.21"
junit = "5.11.4"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-language-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-kotlin" }
configlibtxf = { group = "io.github.jahirxtrap", name = "configlibtxf", version.ref = "configlibtxf" }
jei = { group = "maven.modrinth", name = "jei", version.ref = "jei" }
jade = { group = "maven.modrinth", name = "jade", version.ref = "jade" }
resourcify = { group = "maven.modrinth", name = "resourcify", version.ref = "resourcify" }
sodium = { group = "maven.modrinth", name = "sodium", version.ref = "sodium" }
iris = { group = "maven.modrinth", name = "iris", version.ref = "iris" }
lambdynamiclights = { group = "maven.modrinth", name = "lambdynamiclights", version.ref = "lambdynlights" }
modmenu = { group = "maven.modrinth", name = "modmenu", version.ref = "modmenu" }

# Testing
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }