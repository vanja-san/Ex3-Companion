# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# org.gradle.java.home — set per-machine in ~/.gradle/gradle.properties, NOT here.
# CI (GitHub Actions) sets JAVA_HOME via the workflow; local dev uses Scoop JDK.

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.1
fabric_kotlin_version=1.14.1+kotlin.2.4.20

# Mod Properties
version=1.3.4
group=mod.ex3.companion

# Dependencies
fabric_api_version=0.160.5+26.3

