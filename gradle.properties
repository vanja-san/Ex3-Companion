# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# org.gradle.java.home — set per-machine in ~/.gradle/gradle.properties, NOT here.
# CI (GitHub Actions) sets JAVA_HOME via the workflow; local dev uses Scoop JDK.

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod Properties
version=1.4.1
group=mod.ex3.companion

# Dependency versions live in gradle/libs.versions.toml (version catalog).
# Fabric/Modrinth version ids are tracked there; check https://fabricmc.net/develop
# and https://modrinth.com/mods whenever you bump them.